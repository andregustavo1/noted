<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon-black.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icon-white.svg" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual" />
    <title>Noted</title>

    <!-- Home-screen app: full screen without Safari's bars, its own icon and name. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Noted" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f3f3f3" />

    <script>
      // Apply the saved primary color and theme before render so the + button and the page don't flash.
      try {
        if (JSON.parse(localStorage.getItem("settings") || "{}").theme === "dark") document.documentElement.classList.add("dark");
        const root = document.documentElement.style;
        const bg = localStorage.getItem("primaryColor");
        const fg = localStorage.getItem("primaryColorFg");
        if (bg) root.setProperty("--primary-color", bg);
        if (fg) root.setProperty("--primary-color-fg", fg);
      } catch {}

      // --app-height: the viewport height without the keyboard. The keyboard only ever shrinks the height
      // (and iOS home-screen apps may keep it shrunk afterwards), so only follow resizes that grow it or rotate the screen.
      let appW = innerWidth, appH = 0;
      const setAppHeight = () => {
        appH = innerHeight; appW = innerWidth;
        document.documentElement.style.setProperty("--app-height", appH + "px");
      };
      setAppHeight();
      addEventListener("resize", () => { if (innerHeight > appH || innerWidth !== appW) setAppHeight(); });

      // No pinch zoom in the home-screen app: iOS ignores user-scalable=no there, so block the gesture directly
      // (double-tap zoom is already off via touch-action in index.css).
      for (const type of ["gesturestart", "gesturechange", "gestureend"]) {
        document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
      }
    </script>
  </head>
  <body ontouchstart=""><!-- iOS only fires :active when a touchstart listener exists -->
    <!-- iOS 26 home-screen apps color the status bar from the fixed element found 4px below the top edge (theme-color
         is ignored), or else from the body background. This strip is always that element, so the bar keeps the page
         color whatever is open (editor, dialog dim, menus). Rules it must meet are in index.css (.status-tint). -->
    <div class="status-tint" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
